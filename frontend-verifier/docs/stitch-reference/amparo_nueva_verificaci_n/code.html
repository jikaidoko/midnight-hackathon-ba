<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AMPARO - Nueva Verificación</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Manrope:wght@600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Config -->
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-lowest": "#ffffff",
                    "on-secondary-fixed-variant": "#444076",
                    "on-primary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "inverse-primary": "#c5c0ff",
                    "secondary": "#5c5890",
                    "on-tertiary-fixed": "#201b0f",
                    "tertiary-fixed": "#ede1cd",
                    "secondary-container": "#c5c0ff",
                    "surface-bright": "#fcf8fe",
                    "background": "#fcf8fe",
                    "on-secondary-container": "#504c83",
                    "surface-tint": "#5b5795",
                    "outline": "#787681",
                    "on-tertiary-container": "#99907e",
                    "secondary-fixed-dim": "#c5c0ff",
                    "on-background": "#1c1b1f",
                    "on-primary-fixed-variant": "#443f7b",
                    "on-primary-fixed": "#17114d",
                    "primary-fixed": "#e3dfff",
                    "inverse-surface": "#313034",
                    "surface-container": "#f1ecf2",
                    "surface-dim": "#dcd9df",
                    "inverse-on-surface": "#f3eff5",
                    "surface-container-highest": "#e5e1e7",
                    "tertiary-container": "#2f291c",
                    "surface-container-low": "#f6f2f8",
                    "outline-variant": "#c8c5d1",
                    "tertiary": "#1a1509",
                    "surface": "#fcf8fe",
                    "surface-variant": "#e5e1e7",
                    "on-surface-variant": "#47464f",
                    "primary": "#110847",
                    "on-error-container": "#93000a",
                    "on-tertiary-fixed-variant": "#4d4638",
                    "tertiary-fixed-dim": "#d0c5b2",
                    "surface-container-high": "#ebe7ed",
                    "on-tertiary": "#ffffff",
                    "error": "#ba1a1a",
                    "on-surface": "#1c1b1f",
                    "on-error": "#ffffff",
                    "on-primary-container": "#8e8acb",
                    "error-container": "#ffdad6",
                    "on-secondary-fixed": "#181348",
                    "primary-container": "#26215c",
                    "primary-fixed-dim": "#c5c0ff",
                    "secondary-fixed": "#e3dfff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "lg": "24px",
                    "xxl": "80px",
                    "xs": "4px",
                    "sm": "8px",
                    "xl": "48px",
                    "md": "16px"
            },
            "fontFamily": {
                    "headline-lg": ["Manrope"],
                    "display-lg": ["Manrope"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Manrope"],
                    "body-md": ["Inter"],
                    "label-sm": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "1.3", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "1.4", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "label-sm": ["13px", {"lineHeight": "1", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          },
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Atmospheric Etherealism - Background Blobs */
        .ambient-blob {
            position: absolute;
            filter: blur(120px);
            opacity: 0.5;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-background min-h-screen text-on-background relative overflow-x-hidden pt-xxl">
<!-- Atmospheric Background Layers -->
<div class="ambient-blob bg-[#E8E4F9] w-[800px] h-[800px] rounded-full top-[-100px] left-[-200px]"></div>
<div class="ambient-blob bg-[#FDF9F1] w-[600px] h-[600px] rounded-full bottom-[10%] right-[-150px] opacity-60"></div>
<!-- TopNavBar (Shared Component) -->
<nav class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-md md:px-lg max-w-[1440px] mx-auto h-[80px] bg-white/70 backdrop-blur-[18px] border-b border-white/40 shadow-[0_20px_40px_rgba(38,33,92,0.04)]">
<div class="flex items-center gap-xl">
<!-- Brand -->
<div class="font-headline-md text-headline-md font-semibold text-primary">
                AMPARO / Verificación
            </div>
<!-- Navigation -->
<div class="hidden md:flex items-center gap-lg font-body-md text-body-md h-full pt-4">
<a class="text-on-surface-variant hover:text-primary transition-colors pb-1 h-full flex items-center" href="#">Solicitudes</a>
<!-- Active State Applied Here -->
<a class="text-primary font-semibold border-b-2 border-primary pb-1 h-full flex items-center opacity-80 transition-all duration-200" href="#">Verificar</a>
<a class="text-on-surface-variant hover:text-primary transition-colors pb-1 h-full flex items-center" href="#">Ayuda</a>
</div>
</div>
<!-- Trailing Action -->
<div class="flex items-center gap-md">
<span class="font-body-md text-body-md text-on-surface-variant hidden md:block">Organismo verificador</span>
<div class="w-10 h-10 rounded-full bg-surface-container overflow-hidden border border-white/50">
<img alt="Avatar del verificador" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCJFl98TNlJ4t5rd77UWqEVBDYB5GCmqclOWJFsPjnDZL30Nr3GDljWdR3-95pVWrIQ1xMJBRxemgurKJeW1ROpIlKywHK-sV-YXsEaJkivS7G0HtziuoRU2JpekBRtsGdDoXb9D9Dnj14AD3EArFEX-C57m2bigDT-NI4SMRQDYaWXLIVsJ_6CHyC9Trplh7oWTyHIcKgljdHm6fCSIQVQ6D3JNkpvH0I2f_b_IO5ae8Y6LuSgCWw"/>
</div>
</div>
</nav>
<!-- Main Canvas -->
<main class="w-full max-w-[1240px] mx-auto px-lg py-xl flex flex-col items-center justify-center min-h-[calc(100vh-80px)]">
<!-- Back Action (Contextual) -->
<div class="w-full max-w-[760px] mb-lg flex justify-start">
<button class="flex items-center gap-xs text-secondary hover:text-primary transition-colors font-body-md text-body-md group">
<span class="material-symbols-outlined text-[20px] group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Volver
            </button>
</div>
<!-- Glass Card - Verification Form -->
<div class="w-full max-w-[760px] bg-white/70 backdrop-blur-[18px] border border-white/50 shadow-[0_20px_40px_rgba(38,33,92,0.04)] rounded-[24px] p-xl flex flex-col items-center gap-xl relative">
<!-- Header Section -->
<div class="text-left flex flex-col gap-xs w-full">
<h1 class="font-headline-lg text-headline-lg text-primary">Nueva verificación</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Definí la condición que necesitás comprobar.</p>
</div>
<!-- Form Content -->
<div class="w-full flex flex-col gap-lg">
<!-- Question & Selector -->
<div class="flex flex-col gap-sm">
<label class="font-body-md text-body-md font-semibold text-on-surface">¿Qué querés verificar?</label>
<div class="relative w-full">
<select class="w-full appearance-none bg-surface-container-lowest border-0 border-b border-outline-variant py-md px-md rounded-t-DEFAULT focus:ring-0 focus:border-secondary-container transition-all font-body-md text-body-md text-on-background cursor-pointer">
<option selected="" value="historial">Historial previo</option>
<option value="identidad">Identidad validada</option>
<option value="certificacion">Certificación activa</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Condition Block (Human Sentence) -->
<div class="flex flex-col gap-sm">
<div class="bg-surface-container-lowest/50 backdrop-blur-sm border border-white/50 p-lg rounded-xl flex items-center flex-wrap gap-x-sm gap-y-md shadow-sm">
<span class="font-body-md text-body-md text-on-surface-variant">Confirmar si existen</span>
<select class="appearance-none bg-surface border-0 border-b-2 border-primary/20 focus:border-secondary-container focus:ring-0 font-body-md text-body-md text-primary py-xs px-sm transition-colors cursor-pointer rounded-none min-w-[100px]">
<option selected="" value="al-menos">al menos</option>
<option value="exactamente">exactamente</option>
<option value="menos-de">menos de</option>
</select>
<input class="w-[60px] text-center bg-surface border-0 border-b-2 border-primary/20 focus:border-secondary-container focus:ring-0 font-body-md text-body-md text-primary py-xs px-xs transition-colors rounded-none" min="1" type="number" value="3"/>
<span class="font-body-md text-body-md text-on-surface-variant">reportes sellados previamente</span>
</div>
</div>
<!-- Data Privacy State Note -->
<div class="bg-[#FDF9F1] border border-[#F5EAD4] rounded-lg p-md flex items-start gap-md mt-sm">
<span class="material-symbols-outlined text-[#B89855]" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
<p class="font-body-md text-body-md text-on-tertiary-fixed-variant m-0 pt-0.5">
                        Esta verificación no revelará identidad, contenido ni fechas de los reportes.
                    </p>
</div>
</div>
<!-- Actions -->
<div class="w-full flex items-center justify-end gap-md mt-sm">
<button class="bg-transparent text-secondary hover:text-primary font-headline-md text-[16px] transition-colors py-md px-lg">
                Cancelar
            </button>
<button class="bg-primary-container text-on-primary rounded-lg py-md px-lg font-headline-md text-[16px] hover:bg-primary-container/90 transition-all shadow-md flex items-center justify-center gap-sm group">
                Solicitar verificación
                <span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</main>
</body></html>
