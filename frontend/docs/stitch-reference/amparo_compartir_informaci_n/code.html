<style>
        body {
            background: radial-gradient(circle at top left, #efebff 0%, #fcf8ff 40%, #e9e5ff 100%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(17, 8, 71, 0.05);
        }

        .pastel-lavender { background: #F0EFFF; }
        .pastel-cream { background: #FFF9E6; }
        .pastel-ice { background: #E6F7FF; }
        .pastel-pink { background: #FFE6ED; }

        .custom-checkbox {
            appearance: none;
            background-color: transparent;
            margin: 0;
            font: inherit;
            color: currentColor;
            width: 1.25em;
            height: 1.25em;
            border-radius: 0.25em;
            border: 2px solid #c8c5d1;
            display: grid;
            place-content: center;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .custom-checkbox::before {
            content: "";
            width: 0.65em;
            height: 0.65em;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em white;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked {
            background-color: #110847;
            border-color: #110847;
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        .custom-checkbox:focus-visible {
            outline: max(2px, 0.15em) solid #110847;
            outline-offset: max(2px, 0.15em);
        }
    </style>
<style>

<body class="text-on-surface flex flex-col font-body-md items-center justify-start pb-32">
<!-- Top App Bar -->
<header class="bg-transparent text-primary dark:text-inverse-primary docked full-width top-0 flex justify-between items-center px-container-margin py-4 w-full sticky z-50">
<button aria-label="Atrás" class="hover:bg-white/50 transition-all duration-300 scale-95 active:scale-90 transition-transform p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-headline-md">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold tracking-tight text-primary dark:text-inverse-primary">AMPARO</h1>
<button aria-label="Agregar" class="hover:bg-white/50 transition-all duration-300 scale-95 active:scale-90 transition-transform p-2 rounded-full flex items-center justify-center text-primary dark:text-inverse-primary">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">eco</span>
</button>
</header>
<!-- Main Content -->
<main class="w-full max-w-md px-container-margin pt-4 flex flex-col gap-stack-gap-lg" id="disclosure-manager">
<!-- Header Text -->
<div class="text-center">
<h2 class="font-display-greetings text-display-greetings text-primary mb-2">Elegí qué querés compartir.</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Seleccioná la información que será enviada con tu reporte.</p>
</div>
<!-- Disclosure Options List -->
<section aria-label="Opciones de compartición" class="flex flex-col gap-3">
<!-- Option 1 -->
<label class="pastel-lavender rounded-[24px] p-5 flex items-center justify-between cursor-pointer group hover:opacity-90 transition-opacity">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-white/50 flex items-center justify-center text-primary group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">description</span>
</div>
<div>
<h3 class="font-headline-sm text-[18px] text-primary">Contenido de la denuncia</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-80">Detalles de lo sucedido</p>
</div>
</div>
<input checked="" class="custom-checkbox" type="checkbox"/>
</label>
<!-- Option 2 -->
<label class="pastel-cream rounded-[24px] p-5 flex items-center justify-between cursor-pointer group hover:opacity-90 transition-opacity">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-white/50 flex items-center justify-center text-[#8B6B15] group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">attachment</span>
</div>
<div>
<h3 class="font-headline-sm text-[18px] text-primary">Evidencia adjunta</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-80">Fotos, audios o videos</p>
</div>
</div>
<input checked="" class="custom-checkbox" type="checkbox"/>
</label>
<!-- Option 3 -->
<label class="pastel-ice rounded-[24px] p-5 flex items-center justify-between cursor-pointer group hover:opacity-90 transition-opacity">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-white/50 flex items-center justify-center text-[#2A6B8B] group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div>
<h3 class="font-headline-sm text-[18px] text-primary">Ubicación exacta</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-80">Coordenadas del incidente</p>
</div>
</div>
<input class="custom-checkbox" type="checkbox"/>
</label>
<!-- Option 4 -->
<label class="pastel-pink rounded-[24px] p-5 flex items-center justify-between cursor-pointer group hover:opacity-90 transition-opacity">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-white/50 flex items-center justify-center text-[#9E3E5B] group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<div>
<h3 class="font-headline-sm text-[18px] text-primary">Datos de identidad</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-80">Nombre y contacto</p>
</div>
</div>
<input class="custom-checkbox" type="checkbox"/>
</label>
</section>
<!-- Privacy Note -->
<div class="flex items-start gap-3 bg-white/40 rounded-2xl p-4">
<span class="material-symbols-outlined text-surface-tint mt-0.5">lock</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">Tu identidad por voz nunca se comparte.</p>
</div>
<!-- Recipient Card -->
<section class="glass-card rounded-[32px] p-8 flex flex-col items-center gap-4 text-center mt-2" id="disclosure-recipient">
<div class="w-16 h-16 rounded-full bg-white/80 mx-auto flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 0;">account_balance</span>
</div>
<div>
<h3 class="font-headline-md text-[22px] text-primary leading-tight">Compartir con Autoridad Ambiental.</h3>
<p class="font-body-md text-[15px] text-on-surface-variant mt-2">Esta autorización solo aplica a este reporte.</p>
</div>
<button class="mt-6 w-full bg-primary text-white font-headline-sm text-[18px] h-[56px] rounded-full hover:bg-primary/90 active:scale-95 transition-all duration-300 flex items-center justify-center gap-2">
<span>Autorizar acceso</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</section>
</main>
