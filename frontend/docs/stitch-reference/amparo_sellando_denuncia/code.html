<style>
        .pulse-animation {
            animation: pulse 3s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
        
        .fade-in-up {
            animation: fadeInUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .delay-100 { animation-delay: 100ms; }
        .delay-300 { animation-delay: 300ms; }
        .delay-500 { animation-delay: 500ms; }
        .delay-700 { animation-delay: 700ms; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .orb-gradient {
            background: radial-gradient(circle at center, #c5c0ff 0%, #e3dfff 50%, transparent 100%);
            filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-background min-h-screen flex flex-col font-sans overflow-hidden">
<!-- Top Navigation Placeholder (Hidden for Interstitial, but keeping structure if needed for 'back' in other flows, though requested 'Sin navegación inferior', I will also hide top nav for full immersion as it's an interstitial) -->
<main class="flex-1 flex flex-col items-center justify-center p-container-padding-mobile relative z-10 w-full max-w-[1280px] mx-auto md:px-container-padding-desktop min-h-screen">
<!-- Atmospheric Background -->
<div class="absolute inset-0 z-0 pointer-events-none flex items-center justify-center opacity-60">
<div class="w-[120%] h-[120%] max-w-4xl bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-primary-fixed-dim/30 via-surface/80 to-surface rounded-full blur-[100px]"></div>
</div>
<div class="relative z-10 flex flex-col items-center text-center w-full max-w-md">
<!-- Large Voice Orb -->
<div class="relative w-[220px] h-[220px] mb-12 flex items-center justify-center mx-auto">
<!-- Inner morphing shape simulation (CSS) -->
<div class="absolute inset-0 orb-gradient rounded-full pulse-animation opacity-80 mix-blend-screen shadow-[0_0_80px_rgba(197,192,255,0.7)]"></div>
<div class="absolute inset-8 bg-primary rounded-full pulse-animation flex items-center justify-center shadow-[inset_0_-8px_16px_rgba(0,0,0,0.3)] border border-primary-fixed/20" style="animation-delay: -1.5s;">
<span class="material-symbols-outlined text-white text-6xl" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
</div>
<!-- Text Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-display-lg md:text-display-lg text-primary mb-4 fade-in-up delay-100">
                Protegiendo tu denuncia…
            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-12 fade-in-up delay-300">
                Estamos creando un registro verificable sin hacer público tu contenido.
            </p>
<!-- Lightweight Glass Card Horizontal List -->
<div class="w-full max-w-sm flex justify-between items-center bg-white/40 backdrop-blur-xl p-6 rounded-[32px] shadow-[0_8px_32px_rgba(38,33,92,0.08)] border border-white/60 fade-in-up delay-500">
<div class="flex flex-col items-center space-y-2 text-primary" id="step-1">
<span class="material-symbols-outlined font-label-md" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-label-md text-label-md">Integridad</span>
</div>
<div class="w-px h-10 bg-outline-variant/40"></div>
<div class="flex flex-col items-center space-y-2 text-primary opacity-50 pulse-animation" id="step-2">
<span class="material-symbols-outlined font-label-md">lock</span>
<span class="font-label-md text-label-md">Privacidad</span>
</div>
<div class="w-px h-10 bg-outline-variant/40"></div>
<div class="flex flex-col items-center space-y-2 text-on-surface-variant opacity-30" id="step-3">
<span class="material-symbols-outlined font-label-md">verified</span>
<span class="font-label-md text-label-md">Registro</span>
</div>
</div>
<!-- Optional Cancel / Back (Subtle, as it's an interstitial) -->
<div class="mt-12 fade-in-up delay-700">
<button class="font-label-md text-label-md text-outline hover:text-primary transition-colors">
                    Cancelar proceso
                </button>
</div>
</div>
</main>
<!-- Navigation Suppressed as requested -->
<script>
        // Simple script to simulate progress transition for demonstration
        setTimeout(() => {
            const step2 = document.getElementById('step-2');
            const step3 = document.getElementById('step-3');
            if(step2 && step3) {
                // Change step 2 to done
                step2.classList.remove('opacity-50', 'pulse-animation');
                step2.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
                
                // Set step 3 to active
                step3.classList.remove('text-on-surface-variant', 'opacity-30');
                step3.classList.add('text-primary', 'opacity-50', 'pulse-animation');
            }
        }, 3000);
    </script>
