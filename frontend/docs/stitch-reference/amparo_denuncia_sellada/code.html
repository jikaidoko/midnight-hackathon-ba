<body class="bg-gradient-to-b from-surface to-surface-container-low text-on-background min-h-screen flex flex-col font-body-lg">
<!-- Floating Glass TopAppBar -->
<header class="flex items-center justify-between px-6 w-[calc(100%-2rem)] max-w-[1248px] mx-auto h-14 bg-surface/70 backdrop-blur-xl border border-white/50 shadow-sm fixed top-4 left-0 right-0 z-50 rounded-full">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-sm text-[16px] font-bold tracking-[0.1em] text-primary uppercase">AMPARO</h1>
<div class="text-primary font-label-md text-label-md bg-white/50 px-3 py-1 rounded-full border border-white/80">Verificado</div>
</header>
<!-- Main Content (Canvas) -->
<main class="flex-grow flex flex-col items-center justify-center px-6 md:px-16 pt-24 pb-12 w-full min-h-screen relative overflow-hidden">
<div class="flex flex-col items-center text-center w-full max-w-md relative z-10 mt-8">
<!-- Glowing Seal/Check Orb -->
<div class="w-32 h-32 md:w-40 md:h-40 rounded-full bg-primary flex items-center justify-center shadow-[0_0_80px_rgba(227,223,255,0.8)] ring-[16px] ring-primary-fixed/50 mb-16 relative">
<span class="material-symbols-outlined text-primary-fixed text-6xl md:text-7xl font-bold" data-icon="check" data-weight="700">check</span>
</div>
<!-- Status Chip -->
<div class="inline-flex items-center bg-white/40 backdrop-blur-md text-primary rounded-full px-4 py-1.5 font-label-md text-label-md mb-6 shadow-sm border border-white/60">
<span class="material-symbols-outlined text-[16px] mr-1.5" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
      Sellado
    </div>
<!-- Titles & Text -->
<h2 class="font-display-lg text-[40px] leading-[48px] font-extrabold text-primary mb-4 tracking-tight">Denuncia sellada</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-12 max-w-sm px-4">
        Tu reporte quedó registrado de forma verificable. El contenido permanece privado.
    </p>
<!-- Date (Glass/Pastel Card) -->
<div class="flex items-center text-primary font-label-md text-label-md mb-12 bg-white/60 backdrop-blur-md px-5 py-3 rounded-2xl border border-white/80 shadow-[0_8px_30px_rgba(38,33,92,0.06)]">
<span class="material-symbols-outlined text-[20px] mr-2.5 opacity-80" data-icon="calendar_today">calendar_today</span>
      7 de agosto · 13:42
    </div>
<!-- Actions -->
<div class="flex flex-col w-full gap-4 mt-auto">
<button class="h-14 w-full bg-primary text-on-primary rounded-full font-label-md text-[16px] font-semibold flex items-center justify-center hover:bg-primary/90 transition-colors shadow-lg shadow-primary/20 tracking-wide">
          Ver reporte
      </button>
<button class="h-14 w-full bg-white/40 backdrop-blur-sm text-primary border border-white/80 rounded-full font-label-md text-[16px] font-semibold flex items-center justify-center hover:bg-white/60 transition-colors shadow-sm">
          Volver al inicio
      </button>
</div>
</div>
</main>
