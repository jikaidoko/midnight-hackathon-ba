<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Amparo - Tu voz es tu identidad</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "inverse-surface": "#2f3035",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-container": "#fcaa33",
                        "outline": "#787681",
                        "on-tertiary-container": "#99907e",
                        "secondary": "#855400",
                        "tertiary-container": "#2f291c",

                        "surface-container-highest": "#e3e1e8",

                        "tertiary-fixed-dim": "#d0c5b2",
                        "on-surface-variant": "#47464f",
                        "surface-container-high": "#e9e7ee",
                        "on-primary-container": "#8e8acb",
                        "on-tertiary-fixed-variant": "#4d4638",
                        "on-background": "#1a1b20",
                        "inverse-primary": "#c5c0ff",
                        "surface-dim": "#dbd9e0",
                        "primary-fixed": "#e3dfff",
                        "surface-container-low": "#f4f3fa",
                        "surface": "#faf8ff",
                        "surface-variant": "#e3e1e8",
                        "surface-container": "#efedf4",
                        "background": "#faf8ff",
                        "surface-tint": "#5b5795",
                        "secondary-fixed-dim": "#ffb95d"
                    },
                    "borderRadius": {

                    "spacing": {

                    "fontFamily": {

                }
            }
        }

<style>
        .atmospheric-bg {
            background: 
                radial-gradient(circle at 10% 20%, rgba(230, 220, 255, 0.7) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 230, 240, 0.6) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(255, 245, 235, 0.5) 0%, transparent 60%),
                #fdfbfd;
        }
        .glass-panel {
            background: rgba(255, 245, 235, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.02);
        }
        .orb-glass {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.95) 0%, rgba(245, 235, 255, 0.65) 30%, rgba(255, 220, 235, 0.4) 60%, rgba(255, 245, 235, 0.3) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 
                inset -8px -8px 24px rgba(220, 200, 230, 0.4), 
                inset 8px 8px 24px rgba(255, 255, 255, 1), 
                0 12px 48px rgba(38, 33, 92, 0.08),
                0 0 0 1px rgba(255, 255, 255, 0.6);
        }
        .orb-inner {
            background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.4));
            box-shadow: inset 2px 2px 8px rgba(255,255,255,0.8), 0 4px 12px rgba(0,0,0,0.05);
        }
        .orb-pulse {
            animation: orbPulse 4s ease-in-out infinite alternate;
        }
        @keyframes orbPulse {
            0% { transform: scale(1); border-radius: 48% 52% 51% 49%; }
            50% { transform: scale(1.02); border-radius: 52% 48% 49% 51%; }
            100% { transform: scale(0.98); border-radius: 50% 50% 50% 50%; }
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.6);
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 70%);
            animation: rippleEffect 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            opacity: 0;
        }
        @keyframes rippleEffect {
            0% { transform: scale(0.8); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .ripple-delay-1 { animation-delay: 1.3s; }
        .ripple-delay-2 { animation-delay: 2.6s; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen text-on-surface font-body-lg overflow-x-hidden atmospheric-bg flex flex-col items-center" id="public-home">
<!-- Header / Brand -->
<header class="w-full max-w-md px-container-margin py-8 flex justify-center items-center z-10">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg font-semibold tracking-wide text-on-surface-variant/70">AMPARO</h1>
</header>
<!-- Main Content Canvas -->
<main class="w-full max-w-md px-container-margin flex-1 flex flex-col items-center justify-center relative z-10 text-center pb-32">
<!-- Hero Text -->
<div class="mb-section-padding w-full">
<span class="inline-block px-4 py-1.5 rounded-full bg-white/60 text-primary-container font-label-caps text-label-caps mb-stack-gap-md backdrop-blur-md shadow-sm border border-white/50">
                Identidad privada por voz
            </span>
<h2 class="font-display-greetings text-display-greetings text-[#1a1931] mb-stack-gap-md font-extrabold tracking-tight">
                Tu voz es tu identidad
            </h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Identificate con tu voz para acceder de forma privada a tus reportes.
            </p>
</div>
<!-- Voice Orb Centerpiece -->
<div class="relative flex items-center justify-center w-[240px] h-[240px] mb-section-padding cursor-pointer group" id="voice-orb">
<!-- Ripples behind orb -->
<div class="ripple w-[180px] h-[180px]"></div>
<div class="ripple ripple-delay-1 w-[180px] h-[180px]"></div>
<div class="ripple ripple-delay-2 w-[180px] h-[180px]"></div>
<!-- The Orb -->
<div class="orb-glass orb-pulse w-[180px] h-[180px] rounded-full flex items-center justify-center relative z-10 transition-transform duration-500 group-hover:scale-105 group-active:scale-95">
<div class="orb-inner rounded-full w-[80px] h-[80px] flex items-center justify-center backdrop-blur-md">
<span class="material-symbols-outlined text-[40px] text-[#26215c]" style="font-variation-settings: 'FILL' 1;">
                        mic
                    </span>
</div>
</div>
<!-- Decorative particles -->
<div class="absolute top-[10%] left-[20%] w-2 h-2 rounded-full bg-white opacity-80 shadow-[0_0_8px_rgba(255,255,255,0.8)]"></div>
<div class="absolute bottom-[20%] right-[15%] w-3 h-3 rounded-full bg-white opacity-60 shadow-[0_0_12px_rgba(255,255,255,0.6)]"></div>
<div class="absolute top-[30%] right-[25%] w-1.5 h-1.5 rounded-full bg-[#fcaa33]/30"></div>
</div>
<!-- Call to Action Text -->
<div class="flex flex-col items-center gap-stack-gap-sm z-20">
<p class="font-headline-md text-headline-md text-[#26215c] font-bold">
                Tocá para identificarte
            </p>
<p class="font-body-md text-body-md text-on-surface-variant">
                Solo necesitamos unos segundos de tu voz
            </p>
</div>
</main>
<!-- Privacy Note / Bottom Nav Glass Panel -->
<div class="fixed bottom-0 w-full max-w-md mx-auto glass-panel px-6 py-6 z-20 flex flex-col items-center justify-center rounded-t-[2rem]">
<div class="flex items-center gap-2 text-[#6b4200]/80">
<span class="material-symbols-outlined text-sm">lock</span>
<p class="font-body-sm text-sm font-medium">Tus datos biométricos están protegidos y encriptados</p>
</div>
</div>
<script>
        // Simple interaction script for the orb
        document.addEventListener('DOMContentLoaded', () => {
            const orb = document.getElementById('voice-orb');
            
            orb.addEventListener('click', () => {
                // Visual feedback on click
                const ripples = document.querySelectorAll('.ripple');
                ripples.forEach(r => {
                    r.style.borderColor = 'rgba(239, 159, 39, 0.4)'; // Amber accent
                    r.style.background = 'radial-gradient(circle, rgba(239, 159, 39, 0.1) 0%, transparent 70%)';
                    r.style.animationDuration = '2s';
                });
                
                const icon = orb.querySelector('.material-symbols-outlined');
                icon.style.color = '#EF9F27'; // Amber color for active state
                icon.style.transform = 'scale(1.1)';
                icon.style.transition = 'all 0.3s ease';
                
                // Simulate state change text
                setTimeout(() => {
                    const cta = document.querySelector('.font-headline-md');
                    cta.textContent = 'Escuchando...';
                    cta.classList.add('text-[#fcaa33]', 'animate-pulse');
                    cta.classList.remove('text-[#26215c]');
                }, 300);
            });
        });
    </script>
</body></html>
