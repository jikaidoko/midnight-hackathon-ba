<body class="bg-gradient-to-b from-purple-50 via-background to-orange-50 text-on-surface min-h-screen relative overflow-x-hidden font-body-md flex flex-col md:items-center">
<!-- Ambient Background Effects -->
<div class="ambient-glow -top-20 -left-20" style="background: radial-gradient(circle, rgba(246, 213, 247, 0.4) 0%, rgba(252,248,254,0) 70%);"></div>
<div class="ambient-glow top-1/4 -right-32 w-[500px] h-[500px]" style="background: radial-gradient(circle, rgba(255, 223, 186, 0.3) 0%, rgba(252,248,254,0) 70%);"></div>
<div class="ambient-glow bottom-0 -left-20 w-[400px] h-[400px]" style="background: radial-gradient(circle, rgba(197,192,255,0.25) 0%, rgba(252,248,254,0) 70%);"></div>
<!-- Main Container (Fluid-Fixed Hybrid) -->
<div class="w-full max-w-[1280px] min-h-screen flex flex-col relative z-10 pb-[100px] md:pb-0">
<!-- TopAppBar (Web & Mobile) -->
<header class="bg-transparent flex items-center justify-between px-margin-mobile w-full h-14 md:px-margin-desktop sticky top-0 z-40 transition-shadow duration-300 backdrop-blur-sm" id="top-app-bar">
<!-- Leading Icon -->
<button aria-label="Go back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tight text-primary">AMPARO</h1>
<!-- Trailing Action -->
<div class="flex items-center gap-xs px-3 py-1.5 rounded-full bg-white/60 backdrop-blur-sm text-on-surface-variant shadow-sm border border-white/50">
<span class="material-symbols-outlined text-[16px] filled" style="color: #fcaa33;">verified</span>
<span class="font-label-sm text-label-sm font-semibold">Verificado</span>
</div>
</header>
<!-- Content Canvas -->
<main class="flex-1 px-margin-mobile md:px-margin-desktop pt-16 pb-32 flex flex-col gap-12">
<!-- Hero Section -->
<section class="flex flex-col gap-6 md:flex-row md:items-end md:justify-between pt-8 pb-4">
<div>
<h2 class="font-display-lg-mobile text-[40px] leading-[48px] md:font-display-lg md:text-display-lg text-primary tracking-tight">Hola, Sofía.</h2>
<div class="flex items-center gap-md mt-6">
<p class="font-body-lg text-body-lg text-on-surface-variant">Tus reportes</p>
<span class="inline-flex items-center justify-center px-4 py-1.5 rounded-full bg-white/60 backdrop-blur-sm border border-white/50 shadow-sm text-primary font-label-md text-label-md">
                            3 sellados
                        </span>
</div>
</div>
<button class="mt-8 md:mt-0 flex items-center justify-center h-[60px] md:h-[64px] px-8 rounded-2xl bg-gradient-to-r from-orange-200 via-rose-200 to-purple-200 text-primary font-label-md text-[16px] tracking-wide font-bold hover:opacity-90 transition-opacity active:scale-95 duration-150 shadow-lg border border-white/50">
<span class="material-symbols-outlined mr-3">add</span>
                    Nueva denuncia
                </button>
</section>
<!-- Report Cards List (Bento-ish Grid on Web) -->
<section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-gutter">
<!-- ReportCard 1 (Sellado) - Lavender -->
<div class="bg-purple-50/80 backdrop-blur-sm rounded-[24px] p-lg shadow-[0_8px_30px_rgba(38,33,92,0.04)] hover:shadow-[0_12px_40px_rgba(38,33,92,0.08)] transition-all duration-300 flex flex-col justify-between min-h-[180px] border border-white/60 cursor-pointer group hover:-translate-y-1">
<div class="flex justify-between items-start gap-md">
<p class="font-body-md text-body-md text-primary font-medium line-clamp-2 leading-relaxed">Denuncia por situación ocurrida...</p>
<div class="shrink-0 bg-primary text-on-primary rounded-full px-3 py-1 flex items-center gap-1 font-label-sm text-label-sm shadow-sm">
<span class="material-symbols-outlined text-[14px]">lock</span>
                            Sellado
                        </div>
</div>
<div class="flex items-center justify-between mt-md pt-md border-t border-purple-200/50 group-hover:border-primary-fixed-dim transition-colors">
<span class="font-label-sm text-label-sm text-primary/70">Hace 3 días</span>
<span class="material-symbols-outlined text-primary/70 group-hover:text-primary transition-colors">chevron_right</span>
</div>
</div>
<!-- ReportCard 2 (Compartido) - Cream -->
<div class="bg-orange-50/80 backdrop-blur-sm rounded-[24px] p-lg shadow-[0_8px_30px_rgba(38,33,92,0.04)] hover:shadow-[0_12px_40px_rgba(38,33,92,0.08)] transition-all duration-300 flex flex-col justify-between min-h-[180px] border border-white/60 cursor-pointer group hover:-translate-y-1">
<div class="flex justify-between items-start gap-md">
<p class="font-body-md text-body-md text-primary font-medium line-clamp-2 leading-relaxed">Reporte 2</p>
<div class="shrink-0 bg-orange-200 text-orange-900 rounded-full px-3 py-1 flex items-center gap-1 font-label-sm text-label-sm shadow-sm">
<span class="material-symbols-outlined text-[14px]">share</span>
                            Compartido
                        </div>
</div>
<div class="flex items-center justify-between mt-md pt-md border-t border-orange-200/50 group-hover:border-orange-300 transition-colors">
<span class="font-label-sm text-label-sm text-primary/70">Hace 1 semana</span>
<span class="material-symbols-outlined text-primary/70 group-hover:text-primary transition-colors">chevron_right</span>
</div>
</div>
<!-- ReportCard 3 (Borrador) - Ice -->

<div class="flex justify-between items-start gap-md">
<p class="font-body-md text-body-md text-primary/80 italic font-medium line-clamp-2 leading-relaxed">Reporte 3</p>
<div class="shrink-0 bg-cyan-100 text-cyan-900 rounded-full px-3 py-1 flex items-center gap-1 font-label-sm text-label-sm shadow-sm">
<span class="material-symbols-outlined text-[14px]">draft</span>
                            Borrador
                        </div>
</div>
<div class="flex items-center justify-between mt-md pt-md border-t border-cyan-200/50 group-hover:border-cyan-300 transition-colors">
<span class="font-label-sm text-label-sm text-primary/70">Ayer</span>
<span class="material-symbols-outlined text-primary/70 group-hover:text-primary transition-colors">edit</span>
</div>

<!-- Item 1: Inicio -->
<button class="flex flex-col items-center justify-center text-on-surface-variant w-16 hover:bg-surface-container-highest/30 transition-colors rounded-xl py-1">

<span class="font-label-sm text-label-sm">Inicio</span>
</button>
<!-- Item 2: Reportes (Active) -->
<button class="flex flex-col items-center justify-center bg-primary text-on-primary rounded-full px-5 py-2 active:scale-90 duration-200 shadow-md">
<span class="material-symbols-outlined text-[24px] mb-0.5 filled" style="font-variation-settings: 'FILL' 1;">description</span>
<span class="font-label-sm text-label-sm font-semibold">Reportes</span>
</button>
<!-- Item 3: Ayuda -->
<button class="flex flex-col items-center justify-center text-on-surface-variant w-16 hover:bg-surface-container-highest/30 transition-colors rounded-xl py-1">
<span class="material-symbols-outlined text-[24px] mb-1">help</span>
<span class="font-label-sm text-label-sm">Ayuda</span>
</button>
<!-- Item 4: Perfil -->
<button class="flex flex-col items-center justify-center text-on-surface-variant w-16 hover:bg-surface-container-highest/30 transition-colors rounded-xl py-1">
<span class="material-symbols-outlined text-[24px] mb-1">person</span>
<span class="font-label-sm text-label-sm">Perfil</span>
</button>
</nav>
<!-- Desktop SideNav (Hidden on Mobile, placeholder structure for context based on constraints to hide BottomNav on web) -->
<nav class="hidden md:flex absolute left-0 top-0 h-full w-[80px] flex-col items-center py-xl bg-surface-container-lowest shadow-[8px_0_30px_rgba(38,33,92,0.02)] z-30 transform -translate-x-full">
<!-- Content structurally omitted as focus is main canvas and BottomNav is specified for mobile flow. TopApp bar holds web nav generically. -->
</nav>
</div>
<script>
        // Simple scroll effect for TopAppBar shadow
        window.addEventListener('scroll', () => {
            const header = document.getElementById('top-app-bar');
            if (window.scrollY > 10) {
                header.classList.add('shadow-[0_8px_30px_rgba(38,33,92,0.06)]');
                header.classList.add('bg-white/80');
                header.classList.remove('bg-transparent');
            } else {
                header.classList.remove('shadow-[0_8px_30px_rgba(38,33,92,0.06)]');
                header.classList.remove('bg-white/80');
                header.classList.add('bg-transparent');
            }
        });
    </script>
